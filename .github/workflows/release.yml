name: Release

# Push a tag v<version> that matches package.json to publish that version:
#   npm version minor   (edits package.json and CHANGELOG is yours to write)   →   git push --follow-tags
# The tag runs the whole CI (ci.yml) and publishes the package that CI built.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: The tag is the version, and the changelog has it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          node scripts/release-notes.mjs "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The secrets live in this environment; add required reviewers to it to approve each release by hand.
    environment: marketplace
    permissions:
      contents: write # the GitHub release
    env:
      VSIX: code-notes-${{ needs.version.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: code-notes-vsix
      - name: The package CI built, named for the version, and its notes from the changelog
        run: |
          mv code-notes.vsix "$VSIX"
          node scripts/release-notes.mjs "${{ needs.version.outputs.version }}" > notes.md
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX"
      - name: Open VSX (only when its token is set)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.4.0 publish "$VSIX"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$VSIX" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
