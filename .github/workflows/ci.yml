name: CI

# The one list of what gates a change: pull requests and main run it, and the release workflow calls it before it
# publishes. Not here: test:checktour and test:podcast (screenshot drivers to look at), test:grader (needs a model).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# One run per branch or pull request; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, lint, unit tests, VS Code tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Generated files are up to date (cli/understanding.mjs)
        run: git diff --exit-code
      - name: Lint (ESLint, layers and import cycles)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Skill scripts, and the example journey still matches the example code
        run: |
          python3 skills/code-journey/scripts/journey.py help all > /dev/null
          python3 skills/code-journey/scripts/journey.py check examples/shop place-order quiet
          node skills/understanding-check/scripts/questions.mjs > /dev/null
      - name: Tests in a real VS Code
        run: npm run test:integration
      - name: Package
        run: npm run package -- --out code-notes.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-notes-vsix
          path: code-notes.vsix
          if-no-files-found: error
          retention-days: 14

  panel:
    name: Journey panel and animations (headless browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
      - run: npm run build
      - name: Panel layout and clicks
        run: npm run test:panel
      - name: Every beat of the sample animations, three widths
        run: npm run test:scenes
      - name: Understanding check panel, three widths
        run: npm run test:checkpanel
      - name: Journeys list in the panel, three widths
        run: npm run test:journeylist
