name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, unit tests, VS Code tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Skill script
        run: python3 skills/code-journey/scripts/journey.py help all > /dev/null
      - name: Tests in a real VS Code
        run: npm run test:integration
      - name: Package
        run: npm run package -- --out code-notes.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-notes-vsix
          path: code-notes.vsix
          if-no-files-found: error
          retention-days: 14

  panel:
    name: Journey panel and animations (headless browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Panel layout and clicks
        run: npm run test:panel
      - name: Every beat of the sample animations, three widths
        run: npm run test:scenes
