name: Set up
description: Node 22 with the npm cache, the locked dependencies (npm ci) and, on request, Playwright's Chromium.
inputs:
  chromium:
    description: Install Chromium for the headless-browser checks.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - if: ${{ inputs.chromium == 'true' }}
      run: npx playwright install --with-deps chromium
      shell: bash
