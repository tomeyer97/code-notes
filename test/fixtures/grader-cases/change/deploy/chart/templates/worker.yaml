apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop-worker }
  template:
    metadata:
      labels: { app: shop-worker }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image }}"
          command: ["node", "worker/worker.js"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shop-db, key: url } }
            - name: SMTP_HOST
              value: "{{ .Values.smtpHost }}"
