<!doctype html>
<!-- The Listen view outside VS Code (media/listen.js: where the audio plays): stubs acquireVsCodeApi (posted messages land
     in window.__harness.posted) and sets VS Code's theme variables (?theme=dark|light), both from ../harness/themes.js;
     then the page's bundle, the file the extension loads (out/pages/listen.js). Driven by shoot.mjs next to the journey
     panel's harness (the panel's player is a remote of this one). -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src file:; script-src file: 'unsafe-inline'; media-src file: blob: http://127.0.0.1:*; connect-src file: http://127.0.0.1:*">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../media/common.css">
<link rel="stylesheet" href="../../media/journey-podcast.css">
<link rel="stylesheet" href="../../media/listen.css">
</head>
<body>
<div id="app"></div>
<script src="../harness/themes.js"></script>
<script>
  __harness.stubVsCodeApi({ keepState: true })
  __harness.applyTheme({}, { without: ['editor-foreground', 'editorWidget-background', 'testing-iconPassed', 'toolbar-hoverBackground', 'input-background', 'input-foreground', 'input-border', 'input-placeholderForeground'] })
  document.body.className = 'vscode-' + __harness.themeName()
</script>
<script src="../../out/pages/listen.js"></script>
</body>
</html>
