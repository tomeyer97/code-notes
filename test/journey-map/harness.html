<!doctype html>
<!-- The journey map outside VS Code: stubs acquireVsCodeApi (posted messages land in window.__harness.posted) and sets
     VS Code's theme variables (?theme=dark|light), both from ../harness/themes.js; then the page's bundle, the file the
     extension loads (out/pages/map.js: run `npm run build` first). Driven by shoot.mjs; also opens fine in a browser for
     a quick look. -->
<html>
<head>
<meta charset="utf-8">
<!-- As strict as the webview's: scripts from files (+ this stub), no inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src file:; script-src file: 'unsafe-inline'; media-src file: blob: http://127.0.0.1:*; connect-src file: http://127.0.0.1:*">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../media/common.css">
<link rel="stylesheet" href="../../media/journey-map.css">
<link rel="stylesheet" href="../../media/journey-home.css">
<link rel="stylesheet" href="../../media/journey-scene.css">
<link rel="stylesheet" href="../../media/journey-podcast.css">
</head>
<body>
<div id="app"></div>
<!-- The harness's own script after the body too (VS Code's webview host reads document.body while the page loads;
     shoot.mjs checks no script file comes before it). -->
<script src="../harness/themes.js"></script>
<script>
  __harness.stubVsCodeApi({ keepState: true })
  __harness.applyTheme({}, { without: ['editor-foreground', 'editorWidget-background', 'testing-iconPassed', 'toolbar-hoverBackground', 'input-background', 'input-foreground', 'input-border', 'input-placeholderForeground'] })
  document.body.className = 'vscode-' + __harness.themeName()
</script>
<!-- The page's scripts after the body, as in the webview (the body exists while ELK loads). -->
<script src="../../out/vendor/elk.bundled.js"></script>
<script src="../../out/pages/map.js"></script>
</body>
</html>
