<!doctype html>
<!-- The journey map outside VS Code: stubs acquireVsCodeApi (posted messages land in window.__posted) and sets VS Code's
     theme variables (?theme=dark|light), both from ../harness/themes.js. Driven by shoot.mjs; also opens fine in a
     browser for a quick look. -->
<html>
<head>
<meta charset="utf-8">
<!-- As strict as the webview's: scripts from files (+ this stub), no inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src file:; script-src file: 'unsafe-inline'; media-src file: blob: http://127.0.0.1:*; connect-src file: http://127.0.0.1:*">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../media/common.css">
<link rel="stylesheet" href="../../media/journey-map.css">
<link rel="stylesheet" href="../../media/journey-home.css">
<link rel="stylesheet" href="../../media/journey-scene.css">
<link rel="stylesheet" href="../../media/journey-podcast.css">
</head>
<body>
<div id="app"></div>
<!-- The harness's own script after the body too (VS Code's webview host reads document.body while the page loads;
     shoot.mjs checks no script file comes before it). -->
<script src="../harness/themes.js"></script>
<script>
  stubVsCodeApi({ keepState: true })
  applyTheme({}, { without: ['editor-foreground', 'editorWidget-background', 'testing-iconPassed', 'toolbar-hoverBackground', 'input-background', 'input-foreground', 'input-border', 'input-placeholderForeground'] })
  document.body.className = 'vscode-' + themeName()
  var exports = {}
  var JourneyModel = exports
</script>
<!-- The scripts after the body, as in the webview (the body exists while ELK loads). -->
<script src="../../out/src/journeyModel.js"></script>
<script src="../../out/vendor/elk.bundled.js"></script>
<script src="../../media/common.js"></script>
<script src="../../media/journey-layout.js"></script>
<script src="../../media/journey-farnames.js"></script>
<script src="../../media/journey-graph.js"></script>
<script src="../../media/code-paint.js"></script>
<script src="../../media/journey-scene.js"></script>
<script src="../../media/journey-scene-app.js"></script>
<script src="../../media/journey-home.js"></script>
<script src="../../media/journey-splitter.js"></script>
<script src="../../media/journey-tutorial.js"></script>
<script src="../../media/journey-podcast.js"></script>
<script src="../../media/journey-map.js"></script>
</body>
</html>
